; -----------------------------------------------------------------------------
; GFVIP - Supervisor Configuration for AIS Live Stream Worker
; Path on Ubuntu/Debian: /etc/supervisor/conf.d/ais-stream.conf
; -----------------------------------------------------------------------------

[program:ais-stream-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/global-fishing-vessel-intelligence/artisan ais:listen --daemon --timeout=30 --max-reconnects=50
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/global-fishing-vessel-intelligence/storage/logs/ais-stream-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=30
killasgroup=true
stopasgroup=true
priority=999
