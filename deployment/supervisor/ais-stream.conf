; -----------------------------------------------------------------------------
; GFVIP - Supervisor Configuration for AIS Live Stream Worker
; Path on Linux/aaPanel: /etc/supervisor/conf.d/ais-stream.conf
;
; PERINGATAN ARSITEKTUR:
; Supervisor TIDAK aktif sebagai systemd service pada host production aaPanel.
; Pengelola proses utama yang digunakan adalah SYSTEMD (/etc/systemd/system/ais-stream.service).
; JANGAN aktifkan Supervisor dan Systemd secara bersamaan!
; Provider aisstream.io hanya mengizinkan 1 koneksi WebSocket aktif per API key.
; Oleh karena itu, autostart di sini disetel ke FALSE secara default.
; -----------------------------------------------------------------------------

[program:ais-stream-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /www/wwwroot/gfw.nagakecil.site/artisan ais:listen --daemon --timeout=30 --max-reconnects=50
directory=/www/wwwroot/gfw.nagakecil.site
autostart=false
autorestart=true
user=www
numprocs=1
redirect_stderr=false
stdout_logfile=/www/wwwroot/gfw.nagakecil.site/storage/logs/ais-stream.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/www/wwwroot/gfw.nagakecil.site/storage/logs/ais-stream-error.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
stopwaitsecs=30
killasgroup=true
stopasgroup=true
priority=999
