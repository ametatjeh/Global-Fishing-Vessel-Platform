# =============================================================================
# Nginx Configuration Template for Global Fishing Vessel Tracking (GFVT)
# Domain: gfw.nagakecil.site
# Server Directory: /www/wwwroot/gfw.nagakecil.site
# Compatible with Ubuntu 24.04 and aaPanel
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name gfw.nagakecil.site;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gfw.nagakecil.site;

    root /www/wwwroot/gfw.nagakecil.site/public;
    index index.php index.html;

    # SSL Certificates (managed by aaPanel / Let's Encrypt / Certbot)
    # ssl_certificate /www/server/panel/vhost/cert/gfw.nagakecil.site/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/gfw.nagakecil.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    charset utf-8;

    # Max upload size (for user profile avatar uploads: 2MB max allowed by app)
    client_max_body_size 10M;

    # Vite / Static Assets Caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ /index.php?$query_string;
    }

    # MapLibre Web Worker (.mjs / .js) explicit MIME type
    location ~* \.mjs$ {
        types {
            text/javascript mjs;
        }
        default_type text/javascript;
        expires 30d;
        access_log off;
    }

    # Main Application Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ ^/(storage/logs|bootstrap/cache|config|database|resources|routes|tests) {
        deny all;
    }

    # PHP-FPM Configuration (adjust sock path to match your PHP 8.4 aaPanel installation)
    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-84.sock;
        # fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Forward HTTPS and Host parameters for Laravel URL/Asset generation
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        fastcgi_read_timeout 180s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }
}

